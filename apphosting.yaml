# Firebase App Hosting runtime configuration.
# NEXT_PUBLIC_FIREBASE_* client vars are auto-provided by App Hosting's
# Firebase integration. The Admin SDK vars below are NOT auto-provided —
# they must be supplied explicitly because they're server-only credentials.
#
# Only variables with a real configured value are listed here. If you later
# configure Resend (RESEND_API_KEY / RESEND_FROM_EMAIL) in your local
# .env.local, add matching entries here the same way before that feature
# will work in prod. Email verification uses Firebase Authentication's own
# built-in email-link system, which needs no app-side secret or env var
# at all.
#
# To switch to a custom domain later: change NEXT_PUBLIC_BASE_URL's `value`
# below to the new domain (e.g. "https://mydomain.com") and redeploy — no
# application code changes needed. Also add that domain in Firebase Console
# -> Authentication -> Settings -> Authorized domains (see README/report).
env:
  - variable: NEXT_PUBLIC_BASE_URL
    value: "https://next-academy--mynextlms.asia-southeast1.hosted.app"
    availability:
      - BUILD
      - RUNTIME

  # Explicit client config for the mynextlms project. Set explicitly
  # (rather than relying on App Hosting's automatic Firebase web-app
  # association) because that auto-injection was found to be wired to
  # the wrong project (mynextlerning) for this backend.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAhFVTD8pRXpAzMB3rplxAJ3tXgXqqyNJQ"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "nextacademy.sg"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "mynextlms"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "mynextlms.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "398381285119"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:398381285119:web:7510010a0d92c80bbf96ca"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-3LJ9K5ZGY0"
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "mynextlms"
    availability:
      - RUNTIME

  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: FIREBASE_ADMIN_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
    availability:
      - RUNTIME

  # Required by lib/qr-token.js (signs/verifies every printed ID-card QR
  # code) — /api/teacher/qr-token throws and returns 500 "Unable to issue a
  # QR code" whenever this is missing, which is exactly why it was failing
  # in production: this variable was never added here, so it only existed
  # in local .env.local. Create the secret once with:
  #   firebase apphosting:secrets:set QR_TOKEN_SECRET
  # (paste the same value already used in your local .env.local, or a new
  # 32+ character random string), then grant this backend access when
  # prompted.
  - variable: QR_TOKEN_SECRET
    secret: QR_TOKEN_SECRET
    availability:
      - RUNTIME

  # OPTIONAL — Redis (Upstash) caching layer, see lib/redis-cache.js.
  # Everything that uses it (lib/server/cached-profile.js, the admin
  # dashboard aggregation routes, /api/verify) already checks for these two
  # vars and silently falls back to live Firestore reads when they're
  # absent — the app behaves exactly as before Redis existed until this is
  # actually configured. To enable it:
  #   1. Create a free Redis database at https://console.upstash.com
  #      (region: pick the one closest to asia-southeast1 for lowest
  #      latency from this backend).
  #   2. Copy its "REST URL" and "REST TOKEN" from the Upstash console.
  #   3. Create the secrets and uncomment the two entries below:
  #        firebase apphosting:secrets:set UPSTASH_REDIS_REST_URL --project mynextlms
  #        firebase apphosting:secrets:set UPSTASH_REDIS_REST_TOKEN --project mynextlms
  #      (grant this backend access when prompted), then redeploy.
  # - variable: UPSTASH_REDIS_REST_URL
  #   secret: UPSTASH_REDIS_REST_URL
  #   availability:
  #     - RUNTIME
  # - variable: UPSTASH_REDIS_REST_TOKEN
  #   secret: UPSTASH_REDIS_REST_TOKEN
  #   availability:
  #     - RUNTIME
